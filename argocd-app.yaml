apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: testservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eopterix/Demo_App_Helm.git
    targetRevision: main
    path: charts/testservice
    helm:
      valuesObject:
        name: "EO-Platform-Services Fachgruppe"
        origin: Helm-Chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
